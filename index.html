  let clock = { rid: null, since: 0 };
  function liveSec(rid) {
    if (!P) return 0;
    const st = RS(rid);
    if (st.escaped) return st.secs;
    const ms = st.t + (clock.rid === rid && clock.since ? Date.now() - clock.since : 0);
    return Math.floor(ms / 1000) + st.pen;
  }
  function startClock(rid) {
    if (sandbox || !P || RS(rid).escaped || !P.intro[rid]) return;
    if (clock.rid === rid && clock.since) return;
    stopClock();
    clock = { rid, since: Date.now() };
  }
  function stopClock() {
    if (clock.rid && clock.since && P && !sandbox) { RS(clock.rid).t += Date.now() - clock.since; save(); }
    clock = { rid: null, since: 0 };
  }
  const ctxRoom = () => (route.view === 'room' ? route.id : route.view === 'question' && Q[route.id] ? Q[route.id].ph : null);
  function syncClock() {
    const rid = ctxRoom();
    if (rid && !document.hidden) startClock(rid); else stopClock();
  }
  document.addEventListener('visibilitychange', syncClock);
  setInterval(() => {
    const rid = ctxRoom();
    if (!rid || !P || sandbox) return;
    $$('[data-timer]').forEach((el) => { el.textContent = mmss(liveSec(rid)); });
  }, 500);
  function addPenalty(rid, s, why) {
    if (sandbox) return;
    RS(rid).pen += s;
    save();
    floatText(`+${s} s`, 'pen');
    $$('[data-timer]').forEach((el) => { el.textContent = mmss(liveSec(rid)); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); });
    if (why) toast(`<b>${why}</b>+${s} segundos no cronômetro.`, { icon: 'clock', kind: 'info', ms: 2200 });
  }

  /* ---------------- Envio ao professor (ranking online) ---------------- */
  const SYNC_URL = 'https://script.google.com/macros/s/AKfycbzYd8FOYRRHc4YmuPpa1jbLA6UvFyTrqyZy0cbdCebQs22HiBGS7kv6wGJZ2DZ2wVRxZg/exec';
  const PROJETO = '2fuga';
  const inClaude = /claude/i.test(location.hostname) || !!window.claude;
  const syncOn = () => /^https:\/\/script\.google\.com\//.test(SYNC_URL) && !inClaude;
  if (!store.device) store.device = Math.random().toString(36).slice(2, 10);
  if (!store.outbox || typeof store.outbox !== 'object') store.outbox = {};
  let flushTimer = 0;
  let flushing = false;
  function snapshotOf(p) {
    const n = escapedCount(p);
    const cur = ROOMS.find((r) => !escaped(r.id, p) && Object.keys(p.q).some((id) => Q[id] && Q[id].ph === r.id));
    return {
      id: p.id, nome: p.name, turma: p.turma, xp: totalPts(p), nivel: rankOf(n).name, q: doneCount(p), ft: ftCount(p),
      estrelas: totalStars(p), medalhas: n, fase: n === 4 ? `Escapou das 4 salas · ${mmss(totalTime(p))}` : cur ? `Na sala: ${cur.name}` : `${n} de 4 salas`,
      fases: ROOMS.map((r) => roomQs(r.id).filter((id) => isDone(id, p)).length), concluiu: p.done || 0,
    };
  }
  function syncEvents(evs) {
    if (!syncOn() || sandbox || !P) return;
    const box = store.outbox[P.id] || (store.outbox[P.id] = { ev: [], dirty: false, last: 0 });
    (evs || []).forEach((x) => box.ev.push(x));
    if (box.ev.length > 300) box.ev.splice(0, box.ev.length - 300);
    box.dirty = true;
    save();
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flush, 1200);
  }
  async function flush() {
    if (!syncOn()) return;
    if (flushing) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 1500); return; }
    const ids = Object.keys(store.outbox).filter((id) => store.outbox[id] && store.outbox[id].dirty && store.profiles[id]);
    if (!ids.length) return;
    flushing = true;
    let failed = false;
    for (const id of ids) {
      const box = store.outbox[id];
      const ev = box.ev.slice(0, 60);
      try {
        await fetch(SYNC_URL, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ v: 1, p: PROJETO, dev: store.device, s: snapshotOf(store.profiles[id]), ev }) });
        box.ev.splice(0, ev.length);
        box.dirty = box.ev.length > 0;
        box.last = Date.now();
      } catch (e) { failed = true; }
    }
    Object.keys(store.outbox).forEach((id) => { if (!store.profiles[id]) delete store.outbox[id]; });
    save();
    flushing = false;
    updateSyncNote();
    if (!failed && ids.some((id) => store.outbox[id] && store.outbox[id].dirty)) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, 800); }
  }
  window.addEventListener('online', () => flush());
  setInterval(() => { if (Object.keys(store.outbox).some((id) => store.outbox[id] && store.outbox[id].dirty)) flush(); }, 30000);
  function jsonp(params, timeout) {
    return new Promise((resolve) => {
      const cb = '__mj' + Date.now().toString(36) + Math.floor(Math.random() * 1e5);
      const tag = document.createElement('script');
      let done = false;
      const finish = (d) => { if (done) return; done = true; try { delete window[cb]; } catch (e) { window[cb] = undefined; } tag.remove(); resolve(d); };
      window[cb] = finish;
      tag.onerror = () => finish(null);
      setTimeout(() => finish(null), timeout || 15000);
      tag.src = `${SYNC_URL}?${params}&p=${PROJETO}&callback=${cb}&_=${Date.now()}`;
      document.head.appendChild(tag);
    });
  }
  async function loadGates() {
    if (!syncOn()) return;

    if (changed && P && !sandbox && route.view === 'hub') render();
    if (changed && route.view === 'teacher') renderGateBox();
  }

  }

  /* ---------------- Ranking online (professor) ---------------- */
  let teacherKey = '';

  function loadRanking() {
    if (!syncOn() || !teacherKey || rank.loading) return;

    const cb = '__mr' + Date.now().toString(36) + Math.floor(Math.random() * 1e5);
    const tag = document.createElement('script');
    let done = false;
    const finish = (data, err) => {
      if (done) return;
      done = true;
      rank.loading = false;
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      tag.remove();
      if (data && data.ok) { rank.data = data; rank.err = null; rank.at = Date.now(); if (data.fases && !rank.gatePending) { store.gates = data.fases; save(); renderGateBox(); } }
      else rank.err = (data && data.erro) || err || 'falha';
      renderRankBox();
    };
    window[cb] = (data) => finish(data);
    tag.onerror = () => finish(null, 'rede');
    setTimeout(() => finish(null, 'tempo'), 20000);
    tag.src = `${SYNC_URL}?acao=ranking&p=${PROJETO}&chave=${encodeURIComponent(teacherKey)}&callback=${cb}&_=${Date.now()}`;
    document.head.appendChild(tag);
  }
  function startRankTimer() {

  }

  function gateBoxHTML() {

  function renderGateBox() { const el = $('#gate-box'); if (el) el.innerHTML = gateBoxHTML(); }
  function renderRankBox() { const el = $('#rank-box'); if (el) el.innerHTML = rankBoxHTML(); }
  const FEED_VERB = { 'Acertou': 'acertou', 'Errou': 'errou', 'Entrou na missão': 'entrou no jogo', 'Concluiu a fase': 'escapou da', 'Concluiu a missão': 'abriu o cofre mestre', 'Recomeçou': 'recomeçou do zero' };
  function rankBoxHTML() {

    let status;

    const rows = list.map((a, i) => {

      </li>`;
    }).join('');
    const feed = (d ? d.eventos : []).filter((ev) => inF(ev.turma)).slice(0, 25).map((ev) => {

        : ev.res === 'Concluiu a fase' ? ` ${esc(ev.q)}` : '';

    }).join('');
    return `<div class="rank-top"><p class="rank-status">${status}</p><div class="seg-mini" role="group" aria-label="Filtrar por turma">${filtros}</div></div>
      <dl class="rank-stats"><div><dt>Participantes</dt><dd>${scope.length}</dd></div><div><dt>Ativos agora</dt><dd>${ativos}</dd></div><div><dt>Escaparam de tudo</dt><dd>${concl}</dd></div><div><dt>Média de salas</dt><dd>${media.toFixed(1).replace('.', ',')}</dd></div></dl>
      ${list.length ? `<ol class="rank-list">${rows}</ol>` : `<p class="empty">${d ? 'Nenhum aluno enviou progresso ainda. Assim que alguém começar, ele aparece aqui.' : 'Aguardando os dados…'}</p>`}

  /* ---------------- Respostas ---------------- */
  function answer(qid, L) {
    const q = Q[qid];

    if (st.done || st.w.indexOf(L) !== -1) return null;
    const rid = q.ph;
    const obj = OBJ_OF[qid].o;
    const before = objSolved(obj);
    if (L !== q.ans) {
      st.w.push(L);
      save();
      addPenalty(rid, PEN_WRONG);
      return { ok: false, L, wrongs: st.w.length };
    }
    st.done = true; st.ft = st.w.length === 0; st.at = Date.now();
    save();
    return { ok: true, L, wrongs: st.w.length, clue: !before && objSolved(obj) ? obj : null };
  }

  /* ---------------- Tela: corredor (escolha das salas) ---------------- */
  function doorCard(r) {
    const st = P.rooms[r.id];
    const open = roomOpen(r.id);
    const esc_ = escaped(r.id);
    const found = objsFound(r.id);
    const started = st && (st.t > 0 || found > 0 || P.intro[r.id]);
    const state = esc_ ? 'done' : !open ? 'locked' : started ? 'active' : 'open';
    const foot = state === 'locked'
      ? `<p class="ph-lock">${ic('lock')} Aguardando o professor abrir esta sala.</p>`
      : state === 'done'
        ? `${starsHTML(st.stars)}<span class="dc-time">${ic('clock')} ${mmss(st.secs)} · ${fmt(st.pts)} pts</span><button type="button" class="btn btn-ph btn-sm" data-act="room" data-id="${r.id}">Rever ${ic('arrowRight')}</button>`
        : `<span class="ph-status">${started ? `${found}/4 pistas · ${ic('clock')} ${mmss(liveSec(r.id))}` : `${roomQs(r.id).length} questões · 4 pistas`}</span><button type="button" class="btn btn-ph btn-sm" data-act="room" data-id="${r.id}">${started ? 'Voltar' : 'Entrar'} ${ic('arrowRight')}</button>`;
    return `<li class="door-card ph-${r.ph} is-${state}">
      <div class="dc-door" aria-hidden="true">${state === 'done' ? ic('unlock') : ic(state === 'locked' ? 'lock' : 'door')}<span class="dc-n">${r.n}</span></div>
      <div class="dc-body">
        <span class="eyebrow">Sala ${r.n} · ${r.tema}</span>

        <div class="level-top"><span class="level-badge">${ic('key')} ${n}/4 chaves</span><b class="level-name">${rk.name}</b></div>

  /* ---------------- Tela: sala ---------------- */
  function sceneSVG(r) {
    const badges = r.objects.map((o) => {
      const solved = objSolved(o);
      const prog = o.qs.filter((id) => isDone(id)).length;
      return solved
        ? `<g class="badge on" transform="translate(${o.bx} ${o.by})"><circle r="24" fill="#fff" stroke="${o.symColor}" stroke-width="5"/><text y="9" text-anchor="middle" font-size="25" font-weight="800" fill="${o.symColor}">${o.sym}</text></g>`
        : `<g class="badge" transform="translate(${o.bx} ${o.by})"><circle r="17" fill="#2A2D40" opacity=".88"/><text y="6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">${prog ? `${prog}/${o.qs.length}` : '?'}</text></g>`;
    }).join('');
    const openDoor = escaped(r.id) ? '<g pointer-events="none"><rect x="870" y="180" width="92" height="34" rx="7" fill="#12A35E"/><text x="916" y="203" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" letter-spacing="1">ABERTA</text></g>' : '';
    return `<svg class="scene" viewBox="0 0 1000 600" role="group" aria-label="Cenário: ${r.name}">${r.art()}${badges}${openDoor}</svg>`;
  }
  function viewRoom(rid) {
    const r = RM[rid];
    const st = RS(rid);
    const done = escaped(rid);
    const order = lockOrder(rid);
    const notes = r.objects.map((o) => {
      const solved = objSolved(o);
      const prog = o.qs.filter((id) => isDone(id)).length;
      return `<li class="${solved ? 'on' : ''}"><button type="button" class="note-btn" data-act="obj" data-id="${o.id}">
        <span class="sym" style="--sc:${o.symColor}">${o.sym}</span><span class="note-main"><b>${o.name}</b><span>${solved ? 'pista encontrada' : `${prog}/${o.qs.length} ${plural(o.qs.length, 'desafio', 'desafios')}`}</span></span>
        <span class="note-val">${solved ? `= ${digitOf(rid, o.id)}` : '?'}</span></button></li>`;
    }).join('');
    return `${topbar({ back: { act: 'hub', label: 'Sair da sala (o tempo pausa)' }, title: r.name, sub: `Sala ${r.n} · ${r.tema}`, ph: r.ph, timer: rid })}
    <main class="wrap room ph-${r.ph}">

          : sandbox ? `<section class="card timer-card"><span class="eyebrow">Modo aula</span><b class="big-timer">sem tempo</b><span class="fine">Resolva com a turma e use o botão Resposta.</span></section>`
          : `<section class="card timer-card"><span class="eyebrow">Tempo nesta sala</span><b class="big-timer" data-timer>${mmss(liveSec(rid))}</b><span class="fine">${st.pen ? `inclui ${st.pen} s de penalidade` : 'sem penalidades até agora'}</span></section>`}

  /* ---------------- Tela: questão ---------------- */
  function optHTML(q, L, s, finished) {
    const wrong = s.w.indexOf(L) !== -1;
    const right = finished && L === q.ans;
    const sel = !finished && !wrong && ui.sel === L;
    const dis = finished || wrong;
    const cls = `opt${wrong ? ' is-wrong' : ''}${right ? ' is-right' : ''}${sel ? ' is-sel' : ''}`;
    const mark = wrong ? `<span class="opt-mark">${ic('x')}</span>` : right ? `<span class="opt-mark">${ic('check')}</span>` : '';
    const label = `Alternativa ${L}${wrong ? ', descartada' : ''}${right ? ', correta' : ''}`;
    const attrs = `type="button" class="${cls}" data-act="pick" data-l="${L}" aria-pressed="${sel}"${dis ? ' aria-disabled="true"' : ''}`;
    if (q.imgOpts) {
      const im = IMG[q.id + L];
      return `<button ${attrs} aria-label="${label}"><span class="opt-head"><span class="bubble">${L}</span>${mark}</span><span class="opt-fig paper"><img src="${im.uri}" width="${im.w}" height="${im.h}" alt=""></span></button>`;
    }
    return `<button ${attrs}><span class="bubble" aria-hidden="true">${L}</span><span class="opt-text"><span class="sr-only">${label}: </span>${q.opts[L]}</span>${mark}</button>`;
  }
  function solutionHTML(q) {
    return `<section class="solution" aria-label="Resolução comentada">
      <h2 class="sol-title">${ic('book')} Resolução comentada</h2>
      <div class="sol-body">${q.sol}</div>
      ${q.trap ? `<p class="trap">${ic('alert')}<span><b>Pegadinha:</b> ${q.trap}</span></p>` : ''}
      <p class="sol-answer">Resposta: <span class="ans-b">${q.ans}</span>${q.imgOpts ? `<span>Figura ${q.ans}</span>` : `<span>${q.opts[q.ans]}</span>`}</p>
    </section>`;
  }
  function hintHTML(q, s) {
    const rid = q.ph;
    const used = sandbox || RS(rid).hints[q.id];
    if (s.done) return '';
    return used
      ? `<div class="hint open"><div class="hint-toggle static">${ic('lightbulb')}<b>Dica</b></div><div class="hint-body">${q.hint}</div></div>`
      : `<button type="button" class="hint-buy" data-act="hint" data-id="${q.id}">${ic('lightbulb')}<span><b>Pedir uma dica</b><small>custa +1 min no cronômetro</small></span></button>`;
  }
  function feedbackHTML(q, s) {
    const r = ui.res;
    if (s.done) {
      const fresh = r && r.ok;
      const tries = s.w.length + 1;
      return `<div class="fb fb-ok" role="status"><div class="fb-head"><span class="fb-ic">${ic('check')}</span><div><b>${fresh ? pickOne(PRAISE) : 'Desafio resolvido'}</b><span>Alternativa ${q.ans} · ${s.ft ? 'de primeira' : `na ${tries}ª tentativa`}</span></div></div></div>${solutionHTML(q)}`;
    }
    if (sandbox && ui.reveal) return solutionHTML(q);
    let h = '';
    if (s.w.length) {
      const fresh = r && !r.ok;
      const last = s.w[s.w.length - 1];
      h += `<div class="fb fb-bad" role="status"><div class="fb-head"><span class="fb-ic">${ic('x')}</span><div>${fresh ? `<b>A ${last} não abre nada.</b><span>+${PEN_WRONG} s no cronômetro. Tente outra alternativa.</span>` : `<b>Você já descartou: ${s.w.join(', ')}</b><span>Cada erro soma ${PEN_WRONG} s.</span>`}</div></div></div>`;
    }
    return h + hintHTML(q, s);
  }
  function nextInObject(q) {
    const o = OBJ_OF[q.id].o;
    return o.qs.map((id) => Q[id]).find((x) => !isDone(x.id) && x.id !== q.id) || null;
  }
  function actionsHTML(q, s) {
    const finished = s.done || (sandbox && ui.reveal);
    const o = OBJ_OF[q.id].o;
    if (finished) {
      const nx = nextInObject(q);
      if (nx) return `<button type="button" class="btn btn-ghost btn-lg" data-act="room" data-id="${q.ph}">Sala</button><button type="button" class="btn btn-primary btn-lg grow" data-act="q" data-id="${nx.id}">Próximo desafio do objeto ${ic('arrowRight')}</button>`;
      if (objSolved(o) && !sandbox) return `<button type="button" class="btn btn-lime btn-lg btn-block" data-act="clue" data-id="${o.id}">${ic('key')} Ver a pista do objeto</button>`;
      return `<button type="button" class="btn btn-primary btn-lg btn-block" data-act="room" data-id="${q.ph}">Voltar para a sala ${ic('arrowRight')}</button>`;
    }
    const reveal = sandbox ? `<button type="button" class="btn btn-ghost btn-lg" data-act="reveal">${ic('eye')} Resposta</button>` : '';
    return `${reveal}<button type="button" class="btn btn-primary btn-lg grow" data-act="submit"${ui.sel ? '' : ' disabled'}>${ui.sel ? `Responder ${ui.sel}` : sandbox ? 'Responder' : 'Escolha uma alternativa'}</button>`;
  }
  function viewQuestion(qid) {

  }

  /* ---------------- Tela: certificado ---------------- */
  function certCode(name, turma, pts, ft, stars) {
    const base = `${norm(name)}|${String(turma).toUpperCase()}|${pts}|${ft}|${stars}|g9-sala-fuga`;
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let x = fnv(base);
    let y = fnv(base.split('').reverse().join('') + '#');
    let out = '';
    for (let i = 0; i < 4; i++) { out += A[x % 32]; x = Math.floor(x / 32); }
    for (let i = 0; i < 4; i++) { out += A[y % 32]; y = Math.floor(y / 32); }
    return out.slice(0, 4) + '-' + out.slice(4);
  }
  function viewCert() {
    const top = topbar({ back: { act: 'hub', label: 'Voltar ao corredor' }, title: 'Certificado', sub: 'Sala de Fuga' });
    if (!P.done) {

        <button type="button" class="btn btn-primary" data-act="hub">Voltar ao corredor</button>
      </section></main>`;
    }
    const pts = totalPts();
    const ft = ftCount();
    const stars = totalStars();
    const code = certCode(P.name, P.turma, pts, ft, stars);
    const date = new Date(P.done).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
    return `${top}
    <main class="wrap cert-wrap">
      <article class="cert" aria-label="Certificado de conclusão">
        <div class="cert-band"><span class="logo-chip"><img src="${IMG.logo.uri}" width="${IMG.logo.w}" height="${IMG.logo.h}" alt="Curso G9"></span><div><span class="cert-kicker">Certificado de fuga</span><span class="cert-prog">Sala de Fuga · Revisão ENEM</span></div></div>
        <div class="cert-main">
          <p class="cert-pre">Certificamos que</p>
          <h1 class="cert-name">${esc(P.name)}</h1>
          <p class="cert-text">da turma <b>${esc(P.turma)}</b> escapou das <b>4 salas</b> e abriu o cofre mestre, resolvendo ${TOTAL} questões do ENEM de Porcentagem, Razão e Proporção, Estatística e Geometria Básica.</p>
          <dl class="cert-stats">
            <div><dt>Pontos</dt><dd>${fmt(pts)}</dd></div>

            <div><dt>Estrelas</dt><dd>${stars}/12</dd></div>

        </div>
        <div class="cert-foot">
          <div class="sig"><span class="sig-line"></span><b>Prof. Me. Mateus Bibiano Francisco</b><span>Curso G9 · ${date}</span></div>
          <div class="cert-code"><span>Código de verificação</span><b>${code}</b></div>
        </div>
      </article>
      <div class="cert-actions"><button type="button" class="btn btn-primary btn-lg" data-act="copy-result">${ic('copy')} Copiar resultado</button><button type="button" class="btn btn-ghost btn-lg" data-act="hub">Voltar ao corredor</button></div>
      <textarea id="copy-box" class="copy-fallback" readonly hidden aria-label="Resultado para copiar"></textarea>
      <p class="fine center">Tire um print do certificado ou copie o resultado e envie para o professor.</p>
    </main>`;
  }

  /* ---------------- Confete ---------------- */
  const fxCanvas = document.getElementById('fx');
  const fx = fxCanvas.getContext('2d');
  let parts = [];
  let raf = 0;
  const CONF = ['#FF6347', '#7A5AF8', '#0FAE95', '#2D8CEB', '#D4EE3F', '#F4B400'];
  function sizeFx() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    fxCanvas.width = Math.round(window.innerWidth * dpr);
    fxCanvas.height = Math.round(window.innerHeight * dpr);
    fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function confetti(x, y, n, power) {
    if (reduced()) return;
    if (!parts.length) sizeFx();
    const pw = power || 1;
    for (let i = 0; i < (n || 70); i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.15;
      const sp = (5 + Math.random() * 9) * pw;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35, c: CONF[i % CONF.length], t: 0, ttl: 75 + Math.random() * 60, circ: Math.random() < 0.25 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    fx.clearRect(0, 0, W, H);
    parts = parts.filter((p) => p.t < p.ttl && p.y < H + 40);
    for (const p of parts) {
      p.t += 1; p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.32; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      fx.globalAlpha = Math.max(0, Math.min(1, (p.ttl - p.t) / 22));
      fx.fillStyle = p.c;
      fx.save(); fx.translate(p.x, p.y); fx.rotate(p.r);
      if (p.circ) { fx.beginPath(); fx.arc(0, 0, p.w / 2, 0, 6.283); fx.fill(); }
      else fx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.t * 0.12 + p.r)));
      fx.restore();
    }
    fx.globalAlpha = 1;
    if (parts.length) raf = requestAnimationFrame(tick);
    else { raf = 0; fx.clearRect(0, 0, W, H); }
  }
  function bigConfetti() {
    const W = window.innerWidth;

      const t0 = actx.currentTime + 0.01;
      (SEQ[kind] || []).forEach(([f, d, dl, type, vol]) => {
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, t0 + dl);
        g.gain.setValueAtTime(0.0001, t0 + dl);
        g.gain.exponentialRampToValueAtTime(vol, t0 + dl + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dl + d);
        o.connect(g); g.connect(actx.destination);

  }

      try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) { /* ok */ }
      const fb = $('#feedback');
      if (fb) { const b = fb.getBoundingClientRect(); if (b.bottom > window.innerHeight - 90) fb.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' }); }
    }
  }
  function startGame(form) {
    const name = ($('#f-name').value || '').trim().replace(/\s+/g, ' ');
    const t = form.querySelector('input[name="turma"]:checked');
    const err = $('#f-err');
    const fail = (m) => { err.textContent = m; err.hidden = false; };
    if (name.length < 2) { fail('Digite seu nome para começar.'); $('#f-name').focus(); return; }
    if (name.split(' ').length < 2) { fail('Digite seu nome e sobrenome, para o professor saber quem é você.'); $('#f-name').focus(); return; }
    if (!t) { fail('Escolha a sua turma: M21 ou M22.'); return; }
    const id = slug(name) + '-' + t.value.toLowerCase();
    const existing = store.profiles[id];
    P = existing || newProfile(name, t.value);
    store.profiles[id] = P;
    store.cur = id;
    save();
    sfx('door');
    go('hub');
    syncEvents(existing ? [] : [{ t: Date.now(), q: 'Entrou no jogo', fase: '', res: 'Entrou na missão', tent: 0, xp: 0 }]);
    toast(existing ? `<b>Que bom te ver de novo, ${esc(firstName(P.name))}!</b>Seu progresso foi recuperado.` : `<b>Bem-vindo ao prédio, ${esc(firstName(P.name))}!</b>Escolha uma sala para começar.`, { icon: existing ? 'rotate' : 'key', kind: 'info' });
  }
  function copyResult() {
    const text = `Sala de Fuga · Revisão ENEM (2º ano)\nAluno(a): ${P.name} (${P.turma})\nSalas: ${escapedCount()}/4 · Tempo total: ${mmss(totalTime())}\nPontos: ${fmt(totalPts())} · Estrelas: ${totalStars()}/12 · De primeira: ${ftCount()}/${TOTAL}\nCódigo de verificação: ${certCode(P.name, P.turma, totalPts(), ftCount(), totalStars())}`;
    const ok = () => toast('<b>Resultado copiado</b>Agora é só colar e enviar para o professor.', { icon: 'copy', kind: 'info' });
    const fallback = () => {
      const box = $('#copy-box');
      if (!box) return;
      box.hidden = false; box.value = text; box.focus(); box.select();
      toast('<b>Copie o texto abaixo do certificado</b>Ele já está selecionado.', { icon: 'copy', kind: 'info' });
    };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) {
      const z = e.target.closest('[data-zoom]');
      if (z && !z.closest('#modal-root')) openZoom(z);
      return;
    }
    if (el.getAttribute('aria-disabled') === 'true') return;
    const act = el.getAttribute('data-act');
    const id = el.getAttribute('data-id');
    const rid = ctxRoom();
    switch (act) {
      case 'hub': go('hub'); break;
      case 'room':
        if (roomOpen(id)) go('room', id);
        else toast('<b>Sala fechada</b>O professor vai abrir esta sala na aula.', { icon: 'lock', kind: 'info' });
        break;
      case 'intro-ok': if (P) { P.intro[id] = true; save(); } closeModal(true); sfx('door'); syncClock(); render(); break;
      case 'obj': if (rid) { sfx('tick'); openObject(rid, id); } break;
      case 'clue': showClue(id); break;
      case 'lock': if (rid) { if (escaped(rid)) break; openLock(rid); } break;
      case 'vault': openVault(); break;
      case 'q': go('question', id); break;
      case 'pick': pickOpt(el.getAttribute('data-l')); break;
      case 'submit': submit(); break;
      case 'hint': {
        const q = Q[id];
        if (!q) break;
        if (!sandbox && !RS(q.ph).hints[id]) { RS(q.ph).hints[id] = true; save(); addPenalty(q.ph, PEN_HINT, 'Dica liberada'); }
        const fb = $('#feedback');
        if (fb) fb.innerHTML = feedbackHTML(q, P.q[q.id] || { w: [], done: false });
        break;
      }
      case 'reveal':
        ui.reveal = true; ui.sel = null; render();
        setTimeout(() => { const fb = $('#feedback'); if (fb) fb.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); }, 80);
        break;
      case 'theory': openTheory(id); break;
      case 'cert': go('cert'); break;
      case 'menu': openMenu(); break;
      case 'close-modal': closeModal(); break;
      case 'toggle-sound': store.sound = !store.sound; save(); openMenu(); if (store.sound) sfx('right'); break;
      case 'switch': stopClock(); store.cur = null; P = null; save(); go('welcome'); break;
      case 'use-profile': if (store.profiles[id]) { P = store.profiles[id]; store.cur = id; save(); go('hub'); } break;
      case 'ask-reset':
        confirmBox('Recomeçar do zero?', `Todo o progresso de <b>${esc(P.name)}</b> neste aparelho (salas, tempos e pontos) será apagado. Isso não pode ser desfeito.`, 'do-reset', null, `${ic('rotate')} Recomeçar`);
        break;
      case 'do-reset': {
        stopClock();
        const fresh = newProfile(P.name, P.turma);
        fresh.created = P.created;
        store.profiles[P.id] = fresh;
        P = fresh;
        save();
        go('hub');
        syncEvents([{ t: Date.now(), q: 'Recomeçou do zero', fase: '', res: 'Recomeçou', tent: 0, xp: 0 }]);
        toast('<b>Progresso zerado</b>Boa fuga!', { icon: 'rotate', kind: 'info' });
        break;
      }
      case 'teacher': openPin(); break;
      case 'teacher-back': go(P ? 'hub' : 'welcome'); break;
      case 'teacher-lock': teacherOK = false; teacherKey = ''; stopRankTimer(); go(P ? 'hub' : 'welcome'); break;
      case 'gate-toggle': {
        if (!teacherKey || !RM[id]) break;
        const fases = Object.assign({ p: true, r: true, e: true, g: true }, store.gates || {});
        fases[id] = !gateOpen(id);
        store.gates = fases;
        rank.gatePending = true;
        save();
        renderGateBox();
        const r = RM[id];
        fetch(SYNC_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'fases', p: PROJETO, chave: teacherKey, fases }) })
          .then(() => { toast(`<b>Sala ${r.n} ${fases[id] ? 'aberta' : 'fechada'}</b>${fases[id] ? 'Os alunos já podem entrar.' : 'Os alunos não conseguem entrar até você abrir.'}`, { icon: fases[id] ? 'unlock' : 'lock', kind: 'info' }); },
            () => toast('<b>Não consegui salvar</b>Confira a internet e tente de novo.', { icon: 'alert', kind: 'info' }))
          .finally(() => setTimeout(() => { rank.gatePending = false; loadGates(); }, 1500));
        break;
      }
      case 'rank-filter': rank.filtro = id || 'todas'; renderRankBox(); break;
      case 'rank-refresh': loadRanking(); renderRankBox(); break;
      case 'rank-del': {
        const a = rank.data && rank.data.alunos.find((x) => String(x.id) === id);
        if (a) confirmBox('Remover do ranking?', `<b>${esc(a.nome)}</b> (${esc(a.turma)}) sai do ranking e da planilha. Se o aluno continuar jogando, ele volta a aparecer.`, 'do-rank-del', id, `${ic('trash')} Remover`);
        break;
      }
      case 'do-rank-del':
        closeModal(true);
        try { fetch(SYNC_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'remover', p: PROJETO, chave: teacherKey, id }) }).then(() => setTimeout(loadRanking, 1500), () => toast('<b>Não consegui remover</b>Confira a internet e tente de novo.', { icon: 'alert', kind: 'info' })); } catch (err) { /* ok */ }
        if (rank.data) rank.data.alunos = rank.data.alunos.filter((x) => String(x.id) !== id);
        renderRankBox();
        toast('<b>Aluno removido do ranking</b>', { icon: 'trash', kind: 'info' });
        break;
      case 'start-sandbox':
        stopClock();
        sandbox = true;
        P = newProfile('Modo aula', 'Prof');
        P.id = 'modo-aula';
        ROOMS.forEach((r) => { P.intro[r.id] = true; });
        go('hub');
        toast('<b>Modo aula aberto</b>Todas as salas estão abertas, sem cronômetro.', { icon: 'play', kind: 'info' });
        break;
      case 'exit-sandbox':
        sandbox = false;
        P = store.cur && store.profiles[store.cur] ? store.profiles[store.cur] : null;
        go(teacherOK ? 'teacher' : P ? 'hub' : 'welcome');
        break;
      case 'ask-del': {
        const pr = store.profiles[id];
        if (pr) confirmBox('Apagar este perfil?', `O progresso de <b>${esc(pr.name)}</b> (${esc(pr.turma)}) neste aparelho será apagado. Isso não pode ser desfeito.`, 'do-del', id, `${ic('trash')} Apagar`);
        break;
      }
      case 'do-del':
        delete store.profiles[id];
        if (store.cur === id) { store.cur = null; if (!sandbox) P = null; }
        save();
        go('teacher', null, { keepScroll: true });
        toast('<b>Perfil apagado</b>', { icon: 'trash', kind: 'info' });
        break;
      case 'copy-result': copyResult(); break;
      default: break;
    }
  });

  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'start-form') startGame(f);
    else if (f.id === 'lock-form') tryLock(f.getAttribute('data-id'));
    else if (f.id === 'pin-form') {
      const v = ($('#pin-in').value || '');
      if (fnv('missao:' + norm(v)) === PIN_HASH) { teacherOK = true; teacherKey = norm(v); closeModal(true); stopClock(); go('teacher'); }
      else { const er = $('#pin-err'); er.hidden = false; $('#pin-in').select(); }
    } else if (f.id === 'verify-form') {
      const num = (s) => parseInt(String(s || '').replace(/\D/g, ''), 10) || 0;
      const name = $('#v-name').value;
      const out = $('#verify-out');
      if (!name.trim()) { out.hidden = false; out.innerHTML = '<span>Digite o nome do aluno.</span>'; return; }
      const code = certCode(name, $('#v-turma').value, num($('#v-xp').value), num($('#v-ft').value), num($('#v-stars').value));
      out.hidden = false;
      out.innerHTML = `<span>Código esperado</span>${code}`;
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!t.classList || !t.classList.contains('ld-in')) return;
    t.value = t.value.replace(/\D/g, '').slice(-1);
    if (t.value) { const nx = t.closest('.ld') && t.closest('.ld').nextElementSibling; const inp = nx && nx.querySelector('input'); if (inp) inp.focus(); }
  });

  document.addEventListener('keydown', (e) => {
    const root = $('#modal-root');
    if (!root.hidden) {
      if (e.key === 'Escape' && !root.querySelector('[data-act="intro-ok"]')) { closeModal(); return; }
      if (e.key === 'Backspace' && e.target.classList && e.target.classList.contains('ld-in') && !e.target.value) {
        const pv = e.target.closest('.ld').previousElementSibling; const inp = pv && pv.querySelector('input'); if (inp) { inp.focus(); inp.value = ''; e.preventDefault(); }
        return;
      }
      if (e.key === 'Tab') {
        const f = $$('button, input, select, textarea, [href]', root).filter((x) => !x.disabled && !x.hidden && x.offsetParent !== null);
        if (!f.length) return;
        const first = f[0];
        const last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('hot')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
    if (route.view !== 'question' || e.metaKey || e.ctrlKey || e.altKey) return;
    const tg = e.target;
    if (tg && /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)) return;
    const k = (e.key || '').toUpperCase();
    if (LETTERS.indexOf(k) !== -1) { pickOpt(k); e.preventDefault(); return; }
    if (e.key === 'Enter') {
      const a = document.activeElement;
      if (a && a.matches && a.matches('button:not(.opt)')) return;
      const b = $('.actionbar-in .btn-primary:not([disabled]), .actionbar-in .btn-lime');
      if (b) { e.preventDefault(); b.click(); }
    }
  });

  /* ---------------- Início ---------------- */
  try {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ route: route.view === 'teacher' || sandbox ? { view: 'hub', id: null } : route }));
  } catch (e) { /* ok */ }
  function start(data) {
    if (store.cur && store.profiles[store.cur]) P = store.profiles[store.cur];
    const r = data && data.route;
    route = P && r && r.view ? { view: r.view, id: r.id || null } : { view: P ? 'hub' : 'welcome', id: null };
    render();
    loadGates();
    if (P && syncOn() && !(store.outbox[P.id] && store.outbox[P.id].last)) syncEvents([]);
    else setTimeout(flush, 2500);
  }
  window.addEventListener('pagehide', stopClock);
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();

</script>
